server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Límite de tamaño para subida de archivos (Formato A Excel, adjuntos)
    client_max_body_size 50M;

    # Compresión Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Proxy inverso para la API del Backend (FastAPI)
    location /api/ {
        client_max_body_size 50M;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos estáticos subidos (documentos, fotos)
    location /media/uploads/ {
        alias /var/data/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Assets estáticos con hash de Vite: caché inmutable de larga duración
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # No cachear index.html ni Service Worker para que los despliegues se reflejen de inmediato
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        etag off;
    }

    location ~* (sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        etag off;
    }

    # Fallback para React Router (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Configuración SSL / Certbot (Comentada para despliegue local / Cloudflare Tunnel) ───
    # listen 443 ssl;
    # ssl_certificate /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
}
